# Sends START -> KPI -> END pipeline events as flat JSON via scripts/adapter.py.
# Events go to the adapter's default public API (https://httpbin.org/post).
# Place in .github/workflows/ of your repo.
name: KPI Event Pipeline
 
on:
  workflow_dispatch:
 
env:
  PIPELINE_NAME: ${{ github.workflow }}
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Set pipeline id and start time
        run: |
          start=$(date -u +%Y-%m-%dT%H:%M:%S)
          echo "START_TIME=$start" >> "$GITHUB_ENV"
          echo "PIPELINE_ID=${PIPELINE_NAME// /-}-${GITHUB_RUN_ID}-$(date -u -d "$start" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
 
      - name: Send START event
        run: python scripts/adapter.py start
 
      # ... your real build/test steps go here ...
 
      - name: Send KPI event
        run: |
          # Replace with real KPI values
          python scripts/adapter.py kpi \
            --kpi build_duration_sec=42 \
            --kpi tests_total=120 \
            --kpi tests_passed=118 \
            --kpi code_coverage_pct=87.5
 
      - name: Send END event
        if: always()
        run: python scripts/adapter.py end --status "${{ job.status }}"
