# Sends a build event JSON to the DummyJSON posts API (https://dummyjson.com/docs/posts)
# via scripts/adapter_consumer.py. The event is posted as JSON nested under the post "body".
name: KPI Event Pipeline - Consumer

on:
  workflow_dispatch:
    inputs:
      json_file:
        description: Path to the build event JSON
        required: false
        default: scripts/build_event.json
  push:
    branches: [main]

env:
  API_URL: 'https://dummyjson.com/posts/add'
  API_USER_ID: '1'
  JSON_FILE: ${{ inputs.json_file || 'scripts/build_event.json' }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send KPI event
        run: python scripts/adapter_consumer.py "$JSON_FILE"
