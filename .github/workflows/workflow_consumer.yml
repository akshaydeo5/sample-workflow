# Sends a build event JSON to the consumer service via scripts/adapter_consumer.py.
# The runner must be able to reach API_URL (use a self-hosted runner or a tunnel for localhost).
name: KPI Event Pipeline - Consumer

on:
  workflow_dispatch:
    inputs:
      json_file:
        description: Path to the build event JSON
        required: false
        default: scripts/build_event.json
  push:
    branches: [main]

env:
  API_URL: 'http://localhost:8004/api/v1/events/build'
  JSON_FILE: ${{ inputs.json_file || 'scripts/build_event.json' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send KPI event
        run: python scripts/adapter_consumer.py "$JSON_FILE"
